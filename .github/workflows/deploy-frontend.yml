name: Deploy frontend

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'

jobs:
  ci:
    uses: ./.github/workflows/ci-frontend.yml

  deploy:
    needs: ci
    uses: eymryc/xsel-deploy-mutualise/.github/workflows/deploy.yml@main
    with:
      stack: nextjs-passenger
      app_path: frontend
      # TODO : confirmer le nom de domaine réel une fois décidé
      deploy_path: /home/manoohpq/peci.org
      health_check_url: https://peci.org
      keep_releases: 5
    secrets:
      SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
      SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
      SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
